<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430">
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5b6880}.label{font-size:20px;font-weight:700}.edge{stroke:#7891b7;stroke-width:4;fill:none}</style>
  <rect width="1200" height="430" rx="28" fill="#f7f9fc"/>
  <text x="52" y="58" class="title">ResNet: F(x)에 입력 x를 다시 더하기</text>
  <text x="52" y="92" class="sub">Residual block은 목표 함수 H(x) 대신 잔차 F(x)=H(x)-x를 학습하는 형태로 재표현합니다.</text>
  <rect x="90" y="190" width="140" height="70" rx="12" fill="#edf3ff" stroke="#aac1ee" stroke-width="2"/>
  <text x="160" y="233" text-anchor="middle" class="label">x</text>
  <path d="M230 225 H350" class="edge"/><polygon points="350,225 330,212 330,238" fill="#7891b7"/>
  <rect x="370" y="170" width="180" height="110" rx="14" fill="#2454d8"/>
  <text x="460" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Conv → ReLU</text>
  <text x="460" y="244" text-anchor="middle" font-size="18" fill="#e5edff">Conv</text>
  <path d="M550 225 H730" class="edge"/><polygon points="730,225 710,212 710,238" fill="#7891b7"/>
  <circle cx="770" cy="225" r="35" fill="#fff" stroke="#2454d8" stroke-width="4"/>
  <text x="770" y="235" text-anchor="middle" font-size="34" font-weight="700" fill="#2454d8">+</text>
  <path d="M160 190 V125 H770 V188" class="edge"/>
  <text x="465" y="115" text-anchor="middle" class="label">identity shortcut</text>
  <path d="M805 225 H970" class="edge"/><polygon points="970,225 950,212 950,238" fill="#7891b7"/>
  <rect x="990" y="190" width="140" height="70" rx="12" fill="#e5f5f2" stroke="#8ac7a5" stroke-width="2"/>
  <text x="1060" y="233" text-anchor="middle" class="label">H(x)</text>
  <text x="90" y="360" class="sub">Shape이 다르면 shortcut에 1×1 projection을 사용해 add 가능한 shape로 맞춥니다.</text>
</svg>