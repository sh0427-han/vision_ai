<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <style>text{font-family:'NanumGothic','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5b6880}.label{font-size:20px;font-weight:700}.edge{stroke:#7891b7;stroke-width:4;fill:none}</style>
  <rect width="1200" height="500" rx="28" fill="#f7f9fc"/>
  <text x="52" y="58" class="title">Bayesian 관점: Prior × Likelihood → Posterior → Decision</text>
  <text x="52" y="92" class="sub">PRML 전반을 관통하는 확률적 추론과 의사결정의 연결 구조</text>
  <rect x="75" y="180" width="210" height="115" rx="16" fill="#edf3ff" stroke="#aac1ee" stroke-width="2"/>
  <text x="180" y="222" text-anchor="middle" class="label">Prior</text><text x="180" y="258" text-anchor="middle" class="sub">p(w)</text>
  <rect x="345" y="180" width="210" height="115" rx="16" fill="#fff" stroke="#b9c9e7" stroke-width="2"/>
  <text x="450" y="222" text-anchor="middle" class="label">Likelihood</text><text x="450" y="258" text-anchor="middle" class="sub">p(D|w)</text>
  <path d="M285 238 H335" class="edge"/><path d="M555 238 H640" class="edge"/><polygon points="640,238 620,225 620,251" fill="#7891b7"/>
  <text x="317" y="215" text-anchor="middle" class="label">×</text>
  <rect x="660" y="160" width="220" height="155" rx="18" fill="#2454d8"/>
  <text x="770" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Posterior</text>
  <text x="770" y="252" text-anchor="middle" font-size="20" fill="#e5edff">p(w|D)</text>
  <text x="770" y="285" text-anchor="middle" font-size="16" fill="#91afff">uncertainty after data</text>
  <path d="M880 238 H965" class="edge"/><polygon points="965,238 945,225 945,251" fill="#7891b7"/>
  <rect x="985" y="180" width="150" height="115" rx="16" fill="#e5f5f2" stroke="#8ac7a5" stroke-width="2"/>
  <text x="1060" y="222" text-anchor="middle" class="label">Decision</text><text x="1060" y="258" text-anchor="middle" class="sub">risk / cost</text>
  <text x="75" y="405" class="sub">분류 확률이 같아도 FN/FP 비용이 다르면 최적 threshold와 decision rule은 달라질 수 있습니다.</text>
</svg>