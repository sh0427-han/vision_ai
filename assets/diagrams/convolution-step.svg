  <text x="995" y="225" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Multiply + Sum</text>
  <text x="995" y="270" text-anchor="middle" font-size="19" fill="#e5edff">각 위치의 값 × kernel</text>
  <text x="995" y="307" text-anchor="middle" font-size="19" fill="#e5edff">9개 결과를 합산</text>
  <text x="995" y="352" text-anchor="middle" font-size="27" font-weight="700" fill="#91afff">output[0,0] = 3</text>
  <text x="70" y="482" class="sub">Stride 1이면 kernel을 한 칸씩 이동하며 같은 계산을 반복해 3×3 feature map을 만듭니다.</text>
