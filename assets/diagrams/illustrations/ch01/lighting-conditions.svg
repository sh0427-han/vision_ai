<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">같은 합성 사과 장면의 조명 변화</title>
<desc id="d">같은 형상의 합성 사과를 어두운 노출, 기준 노출, 밝은 노출, clipping 조건으로 비교하고 동일 위치의 RGB 값 변화를 보여주는 그림</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5ecdf"/><stop offset="1" stop-color="#d7e2e9"/></linearGradient>
  <radialGradient id="apple" cx="36%" cy="28%" r="75%"><stop offset="0" stop-color="#ff7569"/><stop offset=".55" stop-color="#d93436"/><stop offset="1" stop-color="#8e1723"/></radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ec46d"/><stop offset="1" stop-color="#285d39"/></linearGradient>
  <filter id="dark"><feComponentTransfer><feFuncR type="linear" slope=".48"/><feFuncG type="linear" slope=".48"/><feFuncB type="linear" slope=".48"/></feComponentTransfer></filter>
  <filter id="bright"><feComponentTransfer><feFuncR type="linear" slope="1.35"/><feFuncG type="linear" slope="1.35"/><feFuncB type="linear" slope="1.35"/></feComponentTransfer></filter>
  <filter id="clip"><feComponentTransfer><feFuncR type="linear" slope="1.9"/><feFuncG type="linear" slope="1.9"/><feFuncB type="linear" slope="1.9"/></feComponentTransfer></filter>
  <style>
    .title{font:700 30px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#17233a}
    .sub{font:500 16px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#607087}
    .label{font:700 17px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#203455}
    .small{font:500 14px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#526681}
    .warn{font:700 14px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#a24d18}
  </style>
</defs>
<text x="60" y="55" class="title">같은 물체라도 촬영 조건이 바뀌면 픽셀 숫자는 달라진다</text>
<text x="60" y="84" class="sub">설명용 합성 이미지 · 동일 위치를 표시해 RGB 값 변화와 clipping을 비교</text>
<g>
    <rect x="45" y="135" width="250" height="385" rx="22" fill="#fff" stroke="#d4deeb" stroke-width="2"/>
    <rect x="60" y="180" width="220" height="245" rx="16" fill="url(#bg)"/>
    <rect x="60" y="350" width="220" height="75" fill="#c9b48b"/>
    <g transform="translate(170 300) scale(0.62)" filter="url(#dark)">
    <ellipse cx="0" cy="118" rx="92" ry="28" fill="#203455" opacity=".16"/>
    <path d="M-17 -44 C-7 -71 7 -82 17 -88" fill="none" stroke="#5b3a28" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 -77 C42 -94 72 -82 79 -54 C49 -49 28 -53 15 -77Z" fill="url(#leaf)"/>
    <path d="M0 -34 C-48 -65 -105 -34 -114 23 C-125 89 -76 146 -15 143 C-1 142 8 136 17 136 C27 136 38 144 55 144 C118 144 151 82 130 22 C111 -34 56 -59 17 -31 C11 -27 6 -27 0 -34Z" fill="url(#apple)"/>
    <ellipse cx="-42" cy="-4" rx="24" ry="41" fill="#fff" opacity=".20" transform="rotate(20 -42 -4)"/>
    <circle cx="64" cy="77" r="7" fill="#7a111c" opacity=".45"/>
  </g>
    <circle cx="210" cy="342" r="7" fill="#fff" stroke="#203455" stroke-width="3"/>
    <text x="63" y="165" class="label">Dark exposure</text>
    <text x="63" y="458" class="small">sample RGB</text>
    <text x="63" y="486" class="label">[72, 24, 18]</text>
    <text x="63" y="510" class="small">gain ≈ 0.5</text>
  </g>
<g>
    <rect x="335" y="135" width="250" height="385" rx="22" fill="#fff" stroke="#d4deeb" stroke-width="2"/>
    <rect x="350" y="180" width="220" height="245" rx="16" fill="url(#bg)"/>
    <rect x="350" y="350" width="220" height="75" fill="#c9b48b"/>
    <g transform="translate(460 300) scale(0.62)">
    <ellipse cx="0" cy="118" rx="92" ry="28" fill="#203455" opacity=".16"/>
    <path d="M-17 -44 C-7 -71 7 -82 17 -88" fill="none" stroke="#5b3a28" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 -77 C42 -94 72 -82 79 -54 C49 -49 28 -53 15 -77Z" fill="url(#leaf)"/>
    <path d="M0 -34 C-48 -65 -105 -34 -114 23 C-125 89 -76 146 -15 143 C-1 142 8 136 17 136 C27 136 38 144 55 144 C118 144 151 82 130 22 C111 -34 56 -59 17 -31 C11 -27 6 -27 0 -34Z" fill="url(#apple)"/>
    <ellipse cx="-42" cy="-4" rx="24" ry="41" fill="#fff" opacity=".20" transform="rotate(20 -42 -4)"/>
    <circle cx="64" cy="77" r="7" fill="#7a111c" opacity=".45"/>
  </g>
    <circle cx="500" cy="342" r="7" fill="#fff" stroke="#203455" stroke-width="3"/>
    <text x="353" y="165" class="label">Reference</text>
    <text x="353" y="458" class="small">sample RGB</text>
    <text x="353" y="486" class="label">[148, 48, 33]</text>
    <text x="353" y="510" class="small">기준 조건</text>
  </g>
<g>
    <rect x="625" y="135" width="250" height="385" rx="22" fill="#fff" stroke="#d4deeb" stroke-width="2"/>
    <rect x="640" y="180" width="220" height="245" rx="16" fill="url(#bg)"/>
    <rect x="640" y="350" width="220" height="75" fill="#c9b48b"/>
    <g transform="translate(750 300) scale(0.62)" filter="url(#bright)">
    <ellipse cx="0" cy="118" rx="92" ry="28" fill="#203455" opacity=".16"/>
    <path d="M-17 -44 C-7 -71 7 -82 17 -88" fill="none" stroke="#5b3a28" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 -77 C42 -94 72 -82 79 -54 C49 -49 28 -53 15 -77Z" fill="url(#leaf)"/>
    <path d="M0 -34 C-48 -65 -105 -34 -114 23 C-125 89 -76 146 -15 143 C-1 142 8 136 17 136 C27 136 38 144 55 144 C118 144 151 82 130 22 C111 -34 56 -59 17 -31 C11 -27 6 -27 0 -34Z" fill="url(#apple)"/>
    <ellipse cx="-42" cy="-4" rx="24" ry="41" fill="#fff" opacity=".20" transform="rotate(20 -42 -4)"/>
    <circle cx="64" cy="77" r="7" fill="#7a111c" opacity=".45"/>
  </g>
    <circle cx="790" cy="342" r="7" fill="#fff" stroke="#203455" stroke-width="3"/>
    <text x="643" y="165" class="label">Bright exposure</text>
    <text x="643" y="458" class="small">sample RGB</text>
    <text x="643" y="486" class="label">[200, 65, 45]</text>
    <text x="643" y="510" class="small">gain ≈ 1.35</text>
  </g>
<g>
    <rect x="915" y="135" width="250" height="385" rx="22" fill="#fff" stroke="#d4deeb" stroke-width="2"/>
    <rect x="930" y="180" width="220" height="245" rx="16" fill="url(#bg)"/>
    <rect x="930" y="350" width="220" height="75" fill="#c9b48b"/>
    <g transform="translate(1040 300) scale(0.62)" filter="url(#clip)">
    <ellipse cx="0" cy="118" rx="92" ry="28" fill="#203455" opacity=".16"/>
    <path d="M-17 -44 C-7 -71 7 -82 17 -88" fill="none" stroke="#5b3a28" stroke-width="12" stroke-linecap="round"/>
    <path d="M15 -77 C42 -94 72 -82 79 -54 C49 -49 28 -53 15 -77Z" fill="url(#leaf)"/>
    <path d="M0 -34 C-48 -65 -105 -34 -114 23 C-125 89 -76 146 -15 143 C-1 142 8 136 17 136 C27 136 38 144 55 144 C118 144 151 82 130 22 C111 -34 56 -59 17 -31 C11 -27 6 -27 0 -34Z" fill="url(#apple)"/>
    <ellipse cx="-42" cy="-4" rx="24" ry="41" fill="#fff" opacity=".20" transform="rotate(20 -42 -4)"/>
    <circle cx="64" cy="77" r="7" fill="#7a111c" opacity=".45"/>
  </g>
    <circle cx="1080" cy="342" r="7" fill="#fff" stroke="#203455" stroke-width="3"/>
    <text x="933" y="165" class="label">Overexposed</text>
    <text x="933" y="458" class="small">sample RGB</text>
    <text x="933" y="486" class="label">[255, 91, 63]</text>
    <text x="933" y="510" class="small">R channel clipped</text>
  </g>
<path d="M60 575 H1140" stroke="#d4deeb" stroke-width="2"/>
<text x="60" y="610" class="small">핵심: 의미는 같은 “사과”여도 intensity distribution은 이동할 수 있고, 255 saturation에서는 원래 차이가 사라진다.</text>
<text x="60" y="636" class="small">이 그림은 실제 카메라 radiometric model이 아니라 brightness gain/clipping 직관을 위한 합성 예시다.</text>
</svg>