<g>
  <rect x="750" y="548" width="350" height="56" rx="14" fill="#eef3fb"/>
  <circle cx="786" cy="576" r="12" fill="#e67266"/>
  <text x="810" y="570" class="small">sample pixel</text>
  <text x="810" y="591" class="label">[R,G,B] = [230,114,102]</text>
</g>
<text x="70" y="560" class="small">JPEG/PNG 파일은 저장 형식이고, decode 뒤에야 이런 픽셀 배열을 얻는다.</text>
<text x="70" y="588" class="small">압축 파일 크기 ≠ 디코딩된 H×W×C 값의 개수</text>
</svg>