  <text x="510" y="205" text-anchor="middle" class="label">CNN feature</text><text x="510" y="238" text-anchor="middle" class="sub">local descriptors</text>
  <path d="M620 220 H710" class="edge"/><polygon points="710,220 690,207 690,233" fill="#7891b7"/>
  <rect x="730" y="135" width="200" height="170" rx="16" fill="#e5f5f2" stroke="#8ac7a5" stroke-width="2"/>
