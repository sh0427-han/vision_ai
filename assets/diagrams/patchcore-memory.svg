<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5b6880}.label{font-size:19px;font-weight:700}.edge{stroke:#7891b7;stroke-width:4;fill:none}</style>
  <rect width="1200" height="520" rx="28" fill="#f7f9fc"/>
  <text x="52" y="58" class="title">PatchCore: 정상 특징 memory bank와 최근접 거리</text>
  <text x="52" y="92" class="sub">정상 이미지의 지역 특징을 저장하고 검사 patch가 정상 특징에서 얼마나 먼지 계산합니다.</text>
