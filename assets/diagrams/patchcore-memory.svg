  <text x="520" y="425" text-anchor="middle" font-size="18" fill="#91afff">distance ↑ → anomaly score ↑</text>
  <rect x="930" y="350" width="200" height="105" rx="16" fill="#fff0e5" stroke="#d79b66" stroke-width="2"/>
